<header class="topbar">
  <a class="brand" href="/">
    <img src="/favicon.ico" class="brand__icon" alt="Logo" width="24" height="24">
    {{ 'APP_NAME' | translate }}
  </a>

  <!-- Mobile toggle -->
  <button class="mobile-tabs-trigger" (click)="openLibrary('youtube')">
    <i class="fa-solid fa-search"></i>
  </button>

  <!-- Desktop tabs -->
  <div class="topbar-tabs">
    <button class="topbar-tab" (click)="openLibrary('youtube')">
      <i class="fa-brands fa-youtube" style="color: #ff3d8b;"></i> {{ 'YOUTUBE_TAB' | translate }}
    </button>
    <button class="topbar-tab" (click)="openLibrary('local')">
      <i class="fa-solid fa-folder-open" style="color: #3ee6c4;"></i> {{ 'LOCAL_TAB' | translate }}
    </button>
    <button class="topbar-tab" (click)="openLibrary('favorites')">
      <i class="fa-solid fa-heart" style="color: #ffb547;"></i> {{ 'FAVORITES_TAB' | translate }}
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px;">
    <!-- Theme Toggle -->
    <app-theme-toggle></app-theme-toggle>

    <!-- Language Select -->
    <app-language-select></app-language-select>
    
    <span class="status" [class.status--live]="recorderService.hasPermission()">
      <i class="fa-solid" [class.fa-microphone]="recorderService.hasPermission()" [class.fa-microphone-slash]="!recorderService.hasPermission()"></i>
      {{ recorderService.hasPermission() ? ('MIC_CONNECTED' | translate) : ('MIC_DISCONNECTED' | translate) }}
    </span>
  </div>
</header>

<div class="layout">
  <main class="stage">
    <app-karaoke-player [currentSong]="currentSong()" (songChanged)="onSongSelected($event)"></app-karaoke-player>
    <app-recorder></app-recorder>
    <app-current-take></app-current-take>
  </main>
</div>

<!-- Modal Library -->
<div class="library-modal-overlay" *ngIf="isLibraryOpen()" (click)="closeLibraryOnBackdrop($event)">
  <app-youtube-search 
    [initialTab]="activeLibraryTab()"
    [currentVideoId]="currentSong()?.videoId"
    (closeLibrary)="isLibraryOpen.set(false)"
    (songSelected)="onSongSelected($event)"
    (expandFavorites)="onExpandFavorites()">
  </app-youtube-search>
</div>

<app-song-change-guard 
  *ngIf="showGuard()" 
  (action)="onGuardAction($event)">
</app-song-change-guard>

<!-- Mobile Bottom Navigation -->
<nav class="bottom-nav">
  <button class="bottom-nav__item" [class.is-active]="!isLibraryOpen()" (click)="isLibraryOpen.set(false)">
    <i class="fa-solid fa-house"></i>
    <span>{{ 'HOME' | translate }}</span>
  </button>
  <button class="bottom-nav__item" [class.is-active]="isLibraryOpen() && activeLibraryTab() === 'youtube'" (click)="openLibrary('youtube')">
    <i class="fa-solid fa-music"></i>
    <span>{{ 'SONGS' | translate }}</span>
  </button>
  <button class="bottom-nav__item" [class.is-active]="isLibraryOpen() && activeLibraryTab() === 'local'" (click)="openLibrary('local')">
    <i class="fa-solid fa-folder-open"></i>
    <span>{{ 'LIBRARY' | translate }}</span>
  </button>
  <button class="bottom-nav__item" (click)="onExpandFavorites()">
    <i class="fa-solid fa-headphones"></i>
    <span>{{ 'LISTEN_MODE' | translate }}</span>
  </button>
</nav>
