
<div class="listen-layout">
  <main class="player-area">
    <app-karaoke-player [currentSong]="currentSong()" (songChanged)="onSongSelected($event)"></app-karaoke-player>
  </main>

  <aside class="playlist-sidebar">
    <div class="sidebar-header">
      <h3><i class="fa-solid fa-heart" style="color: #ff3d8b;"></i> {{ 'PLAYLIST_YOURS' | translate }}</h3>
      <span class="count">{{ favoritesService.favorites().length }}</span>
    </div>

    <ul class="songs">
      <li *ngFor="let song of favoritesService.favorites()">
        <button class="song" [class.is-active]="song.videoId === currentSong()?.videoId" (click)="onSongSelected(song)">
          <span class="song__thumb" *ngIf="song.thumbnailUrl" style="background-image: url('{{song.thumbnailUrl}}'); background-size: cover; background-position: center;"></span>
          <span class="song__thumb song__thumb--local" *ngIf="!song.thumbnailUrl">
            <i class="fa-solid fa-music"></i>
          </span>
          <span class="song__meta">
            <span class="song__title">{{ song.title }}</span>
            <span class="song__channel">{{ song.channelTitle }}</span>
          </span>
          <span class="playing-indicator" *ngIf="song.videoId === currentSong()?.videoId">
            <i class="fa-solid fa-volume-high"></i>
          </span>
        </button>
      </li>
    </ul>

    <div class="empty" *ngIf="favoritesService.favorites().length === 0">
      <i class="fa-solid fa-heart-crack" style="font-size: 2rem; color: #a99bc4; margin-bottom: 8px; opacity: 0.5;"></i>
      <p class="empty__title">{{ 'EMPTY_FAV_TITLE' | translate }}</p>
      <p class="empty__hint">{{ 'EMPTY_FAV_LISTEN_HINT' | translate }}</p>
    </div>
  </aside>
</div>

<!-- Mobile Bottom Navigation -->
<nav class="bottom-nav">
  <button class="bottom-nav__item" (click)="goToStudio('home')">
    <i class="fa-solid fa-house"></i>
    <span>{{ 'HOME' | translate }}</span>
  </button>
  <button class="bottom-nav__item" (click)="goToStudio('youtube')">
    <i class="fa-solid fa-music"></i>
    <span>{{ 'SONGS' | translate }}</span>
  </button>
  <button class="bottom-nav__item" (click)="goToStudio('local')">
    <i class="fa-solid fa-folder-open"></i>
    <span>{{ 'LIBRARY' | translate }}</span>
  </button>
  <button class="bottom-nav__item is-active">
    <i class="fa-solid fa-headphones"></i>
    <span>{{ 'LISTEN_MODE' | translate }}</span>
  </button>
</nav>
