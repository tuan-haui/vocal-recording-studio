<section class="player" aria-label="Trình phát karaoke">
  <div class="player__screen">
    <!-- YouTube Player Embed -->
    <div id="youtube-player"></div>

    <!-- Local Media Screen (Beat tải từ máy tính) -->
    <div class="local-screen" *ngIf="playerService.currentSource() === 'local' && currentSong">
      <!-- Local Video -->
      <video *ngIf="currentSong.mediaType === 'video'" 
             class="local-video" 
             [src]="currentSong.localUrl" 
             playsinline></video>

      <!-- Local Audio: Studio Vinyl Disc Art -->
      <div class="vinyl-stage" *ngIf="currentSong.mediaType !== 'video'">
        <div class="vinyl-disc" [class.is-spinning]="playerService.isPlaying()">
          <div class="vinyl-groove"></div>
          <div class="vinyl-label">
            <i class="fa-solid fa-compact-disc"></i>
          </div>
        </div>
        <div class="vinyl-details">
          <h4>{{ currentSong.title }}</h4>
          <span class="vinyl-tag"><i class="fa-solid fa-file-audio"></i> Beat nhạc từ thiết bị</span>
        </div>
      </div>
    </div>

    <!-- Placeholder khi chưa chọn bài -->
    <div class="player-empty" *ngIf="!currentSong">
      <i class="fa-solid fa-headphones-simple"></i>
      <p>Chọn bài hát từ YouTube hoặc tải beat từ máy tính để bắt đầu</p>
    </div>
  </div>

  <div class="player__bar">
    <button class="icon-btn icon-btn--play" type="button" (click)="togglePlay()" [attr.aria-label]="playerService.isPlaying() ? 'Tạm dừng' : 'Phát'">
      <i class="fa-solid fa-pause" *ngIf="playerService.isPlaying()"></i>
      <i class="fa-solid fa-play" *ngIf="!playerService.isPlaying()" style="margin-left: 2px;"></i>
    </button>
    <span class="time">{{ formatTime(playerService.currentTime()) }}</span>
    <input class="range" type="range" 
      [min]="0" 
      [max]="playerService.duration() || 100" 
      [value]="playerService.currentTime()" 
      (input)="onSeek($event)">
    <span class="time">{{ formatTime(playerService.duration()) }}</span>
    <div style="display: inline-flex; align-items: center; gap: 8px;">
      <i class="fa-solid" 
         [class.fa-volume-high]="playerService.volume() > 50" 
         [class.fa-volume-low]="playerService.volume() > 0 && playerService.volume() <= 50" 
         [class.fa-volume-xmark]="playerService.volume() === 0" 
         (click)="toggleMute()" 
         style="cursor: pointer; opacity: 0.8; font-size: 0.9rem;"
         title="Bật/Tắt âm lượng"></i>
      <input class="range range--volume" type="range" 
        [min]="0" 
        [max]="100" 
        [value]="playerService.volume()" 
        (input)="onVolumeChange($event)">
    </div>
  </div>

  <p class="player__now" *ngIf="currentSong">
    <i class="fa-solid" [class.fa-youtube]="currentSong.source !== 'local'" [class.fa-file-audio]="currentSong.source === 'local'" style="margin-right: 6px; color: #ffb547;"></i>
    <span>Đang phát:</span> {{ currentSong.title }}
  </p>
</section>
