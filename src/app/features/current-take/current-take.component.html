<section class="takes" aria-label="Bản thu">
  <!-- If EMPTY -->
  <div class="empty" *ngIf="sessionService.sessionState() !== 'CURRENT_TAKE' && sessionService.sessionState() !== 'RECORDING'">
    <i class="fa-solid fa-microphone-lines" style="font-size: 2rem; color: #a99bc4; margin-bottom: 8px; opacity: 0.7;"></i>
    <p class="empty__title">Chưa có bản thu nào</p>
    <p class="empty__hint">Nhấn Thu âm và hát cùng bài đang phát.</p>
  </div>
  
  <!-- If CURRENT_TAKE -->
  <div class="take-card" *ngIf="sessionService.sessionState() === 'CURRENT_TAKE' && sessionService.currentTake() as take">
    <h3>
      <i class="fa-solid fa-file-audio" style="color: #ff3d8b; margin-right: 6px;"></i>
      Bản thu hiện tại
    </h3>
    <p class="take-meta">{{ take.songTitle }} • {{ formatTime(take.duration) }}</p>

    <div class="take-player">
      <button class="icon-btn icon-btn--play" type="button" (click)="playTake()" [attr.aria-label]="audioPlayer.isPlaying() ? 'Tạm dừng' : 'Nghe lại'">
        <i class="fa-solid fa-pause" *ngIf="audioPlayer.isPlaying()"></i>
        <i class="fa-solid fa-play" *ngIf="!audioPlayer.isPlaying()" style="margin-left: 2px;"></i>
      </button>
      <span class="time">{{ formatTime(audioPlayer.currentTime()) }}</span>
      <input class="range" type="range" 
             [max]="audioPlayer.duration() || 100" 
             [value]="audioPlayer.currentTime()" 
             readonly>
      <span class="time">{{ formatTime(audioPlayer.duration()) }}</span>
    </div>

    <div style="margin-top: 16px;">
      <app-vocal-effects></app-vocal-effects>
    </div>

    <div class="take-actions" style="display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap;">
      <button class="rec-btn" style="width: auto; padding: 0.6rem 1.4rem; gap: 8px;" (click)="saveTake()">
        <i class="fa-solid fa-download"></i>
        <span class="rec-btn__label">Lưu</span>
      </button>
      <button class="rec-btn" style="width: auto; padding: 0.6rem 1.4rem; background: rgba(255,255,255,0.1); gap: 8px;" (click)="reRecord()">
        <i class="fa-solid fa-rotate-left"></i>
        <span class="rec-btn__label">Thu lại</span>
      </button>
      <button class="rec-btn" style="width: auto; padding: 0.6rem 1.4rem; background: rgba(255, 61, 139, 0.1); border: 1px solid #ff3d8b; gap: 8px;" (click)="deleteTake()">
        <i class="fa-solid fa-trash-can" style="color: #ff3d8b;"></i>
        <span class="rec-btn__label" style="color: #ff3d8b;">Xóa</span>
      </button>
    </div>
  </div>
</section>
