<section class="rec" aria-label="Thu âm">
  <div class="rec__head">
    <h2>
      <i class="fa-solid fa-microphone-lines" style="color: #ff3d8b; margin-right: 6px;"></i>
      Thu âm
    </h2>
    <div class="meter" [style.--level]="(analyserService.inputLevel() * 100) + '%'" [title]="'INPUT_LEVEL' | translate">
      <span class="meter__fill"></span>
    </div>
  </div>

  <!-- Countdown Stage (Big & Animated) -->
  <div class="countdown-stage" *ngIf="sessionService.countdownActive()">
    <div class="countdown-stage__badge">
      <i class="fa-solid fa-music fa-bounce"></i>
      <span>{{ 'GET_READY' | translate }}</span>
    </div>
    
    <div class="countdown-stage__circle-wrap">
      <div class="countdown-pulse-ring"></div>
      <div class="countdown-pulse-ring countdown-pulse-ring--delay"></div>
      <div class="countdown-circle">
        <ng-container [ngSwitch]="sessionService.countdownValue()">
          <span *ngSwitchCase="3" class="countdown-digit">3</span>
          <span *ngSwitchCase="2" class="countdown-digit">2</span>
          <span *ngSwitchCase="1" class="countdown-digit">1</span>
          <span *ngSwitchDefault class="countdown-digit">
            <i class="fa-solid fa-microphone"></i>
          </span>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Standard Controls (when not counting down) -->
  <div class="rec__controls" *ngIf="!sessionService.countdownActive()">
    <output class="rec__time" id="recTime">{{ formatDuration(recorderService.recordingDuration()) }}</output>
    <button class="rec-btn" id="recBtn" type="button" 
            [class.is-recording]="recorderService.isRecording()"
            (click)="!recorderService.hasPermission() ? requestPermission() : (recorderService.isRecording() ? stopRecording() : startRecording())"
            [disabled]="recorderService.hasPermission() && !recorderService.isRecording() && !sessionService.canRecord()">
      <ng-container *ngIf="!recorderService.hasPermission()">
        <i class="fa-solid fa-microphone"></i>
        <span class="rec-btn__label">{{ 'MIC_ENABLE' | translate }}</span>
      </ng-container>
      <ng-container *ngIf="recorderService.hasPermission()">
        <i class="fa-solid" [class.fa-stop]="recorderService.isRecording()" [class.fa-circle]="!recorderService.isRecording()"></i>
        <span class="rec-btn__label">{{ recorderService.isRecording() ? ('STOP_BTN' | translate) : ('RECORD_BTN' | translate) }}</span>
      </ng-container>
    </button>
  </div>
</section>
